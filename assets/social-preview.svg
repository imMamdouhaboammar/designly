      <circle cx="28" cy="30" r="10" fill="#3B82F6" fill-opacity="0.3" />
      <text x="28" y="34" font-family="sans-serif" font-size="11" font-weight="bold" fill="#60A5FA" text-anchor="middle">G</text>
      <text x="46" y="34" font-family="sans-serif" font-size="12" font-weight="700" fill="#F8FAFC">Gemini Nano</text>
      <text x="16" y="65" font-family="sans-serif" font-size="10" font-weight="600" fill="#93C5FD">NB2 / NB Pro</text>
      <text x="16" y="85" font-family="sans-serif" font-size="9" fill="#94A3B8">• Real-world Grounding</text>
      <text x="16" y="105" font-family="sans-serif" font-size="9" fill="#94A3B8">• Extreme 1:8 to 8:1</text>
      <text x="16" y="125" font-family="sans-serif" font-size="9" fill="#94A3B8">• Spatial JSON Logic</text>
      <text x="16" y="150" font-family="sans-serif" font-size="8.5" font-weight="bold" fill="#3B82F6">14 References</text>
