    <!-- Card 5: Seedance 2.5 -->
    <g transform="translate(760, 0)">
      <rect width="170" height="175" rx="14" fill="url(#cardGrad)" stroke="#8B5CF6" stroke-width="1" stroke-opacity="0.4" />
      <circle cx="28" cy="30" r="10" fill="#8B5CF6" fill-opacity="0.3" />
      <text x="28" y="34" font-family="sans-serif" font-size="11" font-weight="bold" fill="#A78BFA" text-anchor="middle">S</text>
      <text x="46" y="34" font-family="sans-serif" font-size="12" font-weight="700" fill="#F8FAFC">Seedance 2.5</text>
      <text x="16" y="65" font-family="sans-serif" font-size="10" font-weight="600" fill="#A78BFA">ByteDance Video</text>
      <text x="16" y="85" font-family="sans-serif" font-size="9" fill="#94A3B8">• 30s Multi-Shot Pass</text>
      <text x="16" y="105" font-family="sans-serif" font-size="9" fill="#94A3B8">• { Dialogue } Lip-Sync</text>
      <text x="16" y="125" font-family="sans-serif" font-size="9" fill="#94A3B8">• 3D Spatial Blockout</text>
      <text x="16" y="150" font-family="sans-serif" font-size="8.5" font-weight="bold" fill="#8B5CF6">50-Slot Ref Kit</text>
    </g>

