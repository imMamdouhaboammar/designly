      <text x="0" y="4" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#E2E8F0" text-anchor="middle">⚡ skills.sh (Vercel)</text>
    </g>
    <!-- Badge 2 -->
    <g transform="translate(-160, 0)">
      <rect x="-65" y="-14" width="130" height="28" rx="14" fill="#1E293B" stroke="#475569" stroke-width="1" />
      <text x="0" y="4" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#E2E8F0" text-anchor="middle">🍺 Homebrew Tap</text>
    </g>
    <!-- Badge 3 -->
    <g transform="translate(0, 0)">
      <rect x="-65" y="-14" width="130" height="28" rx="14" fill="#1E293B" stroke="#475569" stroke-width="1" />
      <text x="0" y="4" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#E2E8F0" text-anchor="middle">📦 npm / Bun CLI</text>
    </g>
    <!-- Badge 4 -->
    <g transform="translate(160, 0)">
      <rect x="-70" y="-14" width="140" height="28" rx="14" fill="#1E293B" stroke="#475569" stroke-width="1" />
      <text x="0" y="4" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#E2E8F0" text-anchor="middle">🎬 Walter Murch Rule</text>
    </g>
    <!-- Badge 5 -->
    <g transform="translate(320, 0)">
      <rect x="-65" y="-14" width="130" height="28" rx="14" fill="#1E293B" stroke="#475569" stroke-width="1" />
      <text x="0" y="4" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#E2E8F0" text-anchor="middle">🌍 Arabic RTL First</text>
    </g>
  </g>

