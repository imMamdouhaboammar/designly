<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07090E" />
      <stop offset="50%" stop-color="#0C1019" />
      <stop offset="100%" stop-color="#06080D" />
    </linearGradient>
    
    <radialGradient id="blueGlow" cx="20%" cy="20%" r="50%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0" />
    </radialGradient>
    
    <radialGradient id="emeraldGlow" cx="80%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="purpleGlow" cx="50%" cy="40%" r="40%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.4" />
    </linearGradient>

    <linearGradient id="brandTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>

    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.25" />
    </linearGradient>

    <!-- Mesh Grid Pattern -->
    <pattern id="meshGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.25" />
    </pattern>
  </defs>

  <!-- Background Layer -->
  <rect width="1280" height="640" fill="url(#bgGrad)" />
  <rect width="1280" height="640" fill="url(#meshGrid)" />

  <!-- Ambient Glow Orbs -->
  <circle cx="200" cy="150" r="350" fill="url(#blueGlow)" />
  <circle cx="1080" cy="500" r="400" fill="url(#emeraldGlow)" />
  <circle cx="640" cy="240" r="300" fill="url(#purpleGlow)" />

  <!-- Outer Border Frame -->
  <rect x="24" y="24" width="1232" height="592" rx="20" fill="none" stroke="#334155" stroke-width="1.5" stroke-opacity="0.4" />

  <!-- Top Category Tag -->
  <g transform="translate(640, 75)">
    <rect x="-210" y="-16" width="420" height="32" rx="16" fill="url(#pillGrad)" stroke="#3B82F6" stroke-width="1" stroke-opacity="0.5" />
    <text x="0" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="2.5" fill="#60A5FA" text-anchor="middle">COMMERCIAL ART DIRECTION &amp; NEURAL MESH</text>
  </g>

  <!-- Brand Header & Logo -->
  <g transform="translate(640, 160)">
    <!-- Logo Icon -->
    <g transform="translate(-160, -32) scale(0.65)">
      <rect x="0" y="0" width="96" height="96" rx="24" fill="#0F172A" stroke="#3B82F6" stroke-width="3" stroke-opacity="0.8" />
      <path d="M 28 28 L 68 28 L 68 48 L 48 48 L 48 68 L 28 68 Z" fill="#3B82F6" />
      <circle cx="60" cy="60" r="8" fill="#10B981" />
    </g>
    <!-- Title Text -->
    <text x="-90" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="64" font-weight="900" letter-spacing="-1.5" fill="url(#brandTextGrad)">Designly</text>
    <text x="185" y="-6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#10B981">v5.0.2</text>
  </g>

  <!-- Subtitle -->
  <text x="640" y="235" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="400" fill="#94A3B8" text-anchor="middle" letter-spacing="0.2">
    21 Modular Skills · 16 Custom Agents · Cannes Creative Direction · 571 Legendary Campaigns
  </text>

  <!-- Badges Row -->
  <g transform="translate(640, 280)">
