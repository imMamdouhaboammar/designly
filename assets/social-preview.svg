      <circle cx="28" cy="30" r="10" fill="#EC4899" fill-opacity="0.3" />
      <text x="28" y="34" font-family="sans-serif" font-size="11" font-weight="bold" fill="#F472B6" text-anchor="middle">M</text>
      <text x="46" y="34" font-family="sans-serif" font-size="12" font-weight="700" fill="#F8FAFC">MiniMax</text>
      <text x="16" y="65" font-family="sans-serif" font-size="10" font-weight="600" fill="#F472B6">Hailuo Engine</text>
      <text x="16" y="85" font-family="sans-serif" font-size="9" fill="#94A3B8">• Cinematic Physics</text>
      <text x="16" y="105" font-family="sans-serif" font-size="9" fill="#94A3B8">• Camera 6-Axis Vectors</text>
      <text x="16" y="125" font-family="sans-serif" font-size="9" fill="#94A3B8">• Bilingual Syntaxes</text>
      <text x="16" y="150" font-family="sans-serif" font-size="8.5" font-weight="bold" fill="#EC4899">Motion 1-10 Slider</text>
    </g>

    <!-- Card 3: Kimi Design -->
    <g transform="translate(380, 0)">
      <rect width="170" height="175" rx="14" fill="url(#cardGrad)" stroke="#10B981" stroke-width="1" stroke-opacity="0.4" />
      <circle cx="28" cy="30" r="10" fill="#10B981" fill-opacity="0.3" />
      <text x="28" y="34" font-family="sans-serif" font-size="11" font-weight="bold" fill="#34D399" text-anchor="middle">K</text>
      <text x="46" y="34" font-family="sans-serif" font-size="12" font-weight="700" fill="#F8FAFC">Kimi Design</text>
      <text x="16" y="65" font-family="sans-serif" font-size="10" font-weight="600" fill="#34D399">Moonshot Visual</text>
      <text x="16" y="85" font-family="sans-serif" font-size="9" fill="#94A3B8">• Coordinate Zoning</text>
      <text x="16" y="105" font-family="sans-serif" font-size="9" fill="#94A3B8">• Design Token Cards</text>
      <text x="16" y="125" font-family="sans-serif" font-size="9" fill="#94A3B8">• Exact Copy Bounding</text>
      <text x="16" y="150" font-family="sans-serif" font-size="8.5" font-weight="bold" fill="#10B981">Paired SVG / CSS</text>
    </g>

    <!-- Card 4: Claude Design -->
    <g transform="translate(570, 0)">
      <rect width="170" height="175" rx="14" fill="url(#cardGrad)" stroke="#F59E0B" stroke-width="1" stroke-opacity="0.4" />
      <circle cx="28" cy="30" r="10" fill="#F59E0B" fill-opacity="0.3" />
      <text x="28" y="34" font-family="sans-serif" font-size="11" font-weight="bold" fill="#FBBF24" text-anchor="middle">C</text>
      <text x="46" y="34" font-family="sans-serif" font-size="12" font-weight="700" fill="#F8FAFC">Claude Design</text>
      <text x="16" y="65" font-family="sans-serif" font-size="10" font-weight="600" fill="#FBBF24">Anthropic 3.7</text>
      <text x="16" y="85" font-family="sans-serif" font-size="9" fill="#94A3B8">• Anti-Slop Finish Gate</text>
      <text x="16" y="105" font-family="sans-serif" font-size="9" fill="#94A3B8">• Precision Vector SVG</text>
      <text x="16" y="125" font-family="sans-serif" font-size="9" fill="#94A3B8">• UI State Machines</text>
      <text x="16" y="150" font-family="sans-serif" font-size="8.5" font-weight="bold" fill="#F59E0B">Tailwind Tokens</text>
