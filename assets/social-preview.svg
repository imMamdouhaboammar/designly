    <g transform="translate(950, 0)">
      <rect width="170" height="175" rx="14" fill="url(#cardGrad)" stroke="#06B6D4" stroke-width="1" stroke-opacity="0.4" />
      <circle cx="28" cy="30" r="10" fill="#06B6D4" fill-opacity="0.3" />
      <text x="28" y="34" font-family="sans-serif" font-size="11" font-weight="bold" fill="#22D3EE" text-anchor="middle">K</text>
      <text x="46" y="34" font-family="sans-serif" font-size="12" font-weight="700" fill="#F8FAFC">Kling 3.0 Pro</text>
      <text x="16" y="65" font-family="sans-serif" font-size="10" font-weight="600" fill="#22D3EE">Kuaishou Video</text>
      <text x="16" y="85" font-family="sans-serif" font-size="9" fill="#94A3B8">• [Character: ] Binding</text>
      <text x="16" y="105" font-family="sans-serif" font-size="9" fill="#94A3B8">• 6-Zone Motion Brush</text>
      <text x="16" y="125" font-family="sans-serif" font-size="9" fill="#94A3B8">• Native Negative Field</text>
      <text x="16" y="150" font-family="sans-serif" font-size="8.5" font-weight="bold" fill="#06B6D4">6-Axis Trajectory</text>
