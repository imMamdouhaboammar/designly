  <!-- Bottom Command Bar -->
  <g transform="translate(640, 565)">
    <rect x="-420" y="-18" width="840" height="36" rx="8" fill="#0B0F19" stroke="#334155" stroke-width="1" />
    <text x="-400" y="5" font-family="monospace" font-size="12" fill="#38BDF8">$ npx skills add imMamdouhaboammar/designly</text>
    <text x="140" y="5" font-family="monospace" font-size="12" fill="#94A3B8">|  brew install designly  |  npm i designly</text>
  </g>
