name: Designly CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  core-cli:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install locked development dependencies
        run: bun install --frozen-lockfile
      - name: Build JS and TypeScript declarations
        run: bun run build
      - name: Bun core library and CLI regression tests
        run: bun test
      - name: Published TypeScript consumer contract
        run: bun run test:types
      - name: Compiler file, inline JSON, and stdin input contracts
        run: python -m unittest discover -s evals/cli -p 'test_*.py' -v

  supply-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install locked development dependencies
        run: bun install --frozen-lockfile
      - name: Build npm artifacts
        run: bun run build
      - name: Supply chain, whitelist, and packed npm entry points
        run: |
          python evals/supply_chain/test_supply_chain.py
          python -m unittest discover -s evals/supply_chain -p 'test_*.py' -v
      - name: Skills and Homebrew distribution checks
        run: |
          python tools/publish_skills_sh.py --check
          python tools/homebrew_installer.py --check
          python evals/homebrew/test_homebrew.py

  python-mesh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Python test dependencies
        run: python -m pip install --disable-pip-version-check pyyaml jsonschema

      - name: Compile Python
        run: python -m compileall -q shared skills evals tools

      - name: Model Adapters Unit & Integration Tests
        run: python evals/adapters/test_adapters.py

      - name: Validate Design Neural Mesh
        run: python shared/scripts/validate_mesh.py

      - name: Validate Skill interfaces
        run: python shared/scripts/validate_skill_interfaces.py

      - name: Validate Codex agents
        run: python shared/scripts/validate_agent_configs.py

      - name: Regression baseline
        run: python evals/baseline/test_monolith_parity.py

      - name: Skill routing
        run: python evals/routing/test_skill_catalog.py

      - name: Prompt Playground product surface
        run: python evals/product/test_prompt_playground.py

      - name: Typed handoff contracts
        run: python evals/handoffs/test_contracts.py

      - name: Agent boundaries
        run: python evals/handoffs/test_agents.py

      - name: Edit sanitizer regression suite
        run: python evals/edit/test_edit_sanitizer.py

      - name: Revision routing
        run: python evals/visual/test_revision_router.py

      - name: Mesh adversarial evals
        run: python evals/run_mesh_evals.py

      - name: Public plugin preflight
        run: python tools/validate_public_plugin.py .

      - name: Deterministic package build
        run: |
          mkdir -p /tmp/designly-pack
          python tools/package_plugin.py . /tmp/designly-pack/a.zip
          python tools/package_plugin.py . /tmp/designly-pack/b.zip
          cmp /tmp/designly-pack/a.zip /tmp/designly-pack/b.zip
