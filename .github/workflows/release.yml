name: Release & Publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Build Package & Artifacts
        run: |
          bun run build
          python3 tools/homebrew_installer.py --tarball
          python3 tools/package_plugin.py . dist/designly-v5.0.0.zip
          python3 tools/publish_skills_sh.py --build

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/designly-v5.0.0.zip
            dist/designly-5.0.0.tar.gz
            dist/skills-sh/skills-manifest.json
            assets/social-preview.png
            assets/social-preview.svg
          draft: false
          prerelease: false
          generate_release_notes: true

      - name: Publish to npm with Provenance
        if: env.NPM_TOKEN != ''
        run: |
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc
          bun publish --provenance --access public
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
